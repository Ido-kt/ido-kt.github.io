name: AccessFlow SDK Playwright Integration Tests

on:
  push:
    branches: ['**']
    paths: ['.github/workflows/sdk-playwright-tests.yml']
  pull_request:
    branches: ['**']
    paths: ['.github/workflows/sdk-playwright-tests.yml']
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Test cycle: change only this line to choose which job runs (one job per push).
# Options: none | node-local | python-local | java-playwright-junit | java-playwright-testng
# Cycle: 1=node-local, 3=python-local, 5=java-playwright-junit, 6=java-playwright-testng
# -----------------------------------------------------------------------------
env:
  SDK_PLAYWRIGHT_JOB: none

jobs:
  noop:
    if: env.SDK_PLAYWRIGHT_JOB == 'none'
    name: "(no Playwright job this run)"
    runs-on: ubuntu-22.04
    steps:
      - run: echo "No Playwright job enabled for this run"

  node-local:
    if: env.SDK_PLAYWRIGHT_JOB == 'node-local'
    name: Node Playwright
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install test dependencies
        working-directory: ./sdk-tests/node
        run: npm ci

      - name: Install SDK from local package
        working-directory: ./sdk-tests/node
        run: |
          echo "📦 Installing SDK from local package..."
          npm install ../../sdk-tests/packages/acsbe-accessflow-sdk.tgz

      - name: Install Playwright browsers
        working-directory: ./sdk-tests/node
        run: npx playwright install --with-deps chromium

      - name: Run tests
        working-directory: ./sdk-tests/node
        env:
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}
          CI: true
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-playwright-results
          path: |
            sdk-tests/node/test-results/
            sdk-tests/node/playwright-report/
          retention-days: 7

  python-local:
    if: env.SDK_PLAYWRIGHT_JOB == 'python-local'
    name: Python Playwright
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        working-directory: ./sdk-tests/python
        run: pip install -r requirements.txt

      - name: Install SDK from local package
        working-directory: ./sdk-tests/python
        run: |
          echo "📦 Installing SDK from local package..."
          pip install ../packages/accessflow_sdk-*.whl

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        working-directory: ./sdk-tests/python
        env:
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}
          CI: true
        run: pytest -v -m "not selenium"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-playwright-results
          path: sdk-tests/python/test-results/
          retention-days: 7

  java-playwright-junit:
    if: env.SDK_PLAYWRIGHT_JOB == 'java-playwright-junit'
    name: Java Playwright (JUnit 5)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install SDK to local Maven repository
        working-directory: ./sdk-tests/java
        run: |
          echo "📦 Installing SDK JAR to local Maven repository..."
          JAR_FILE="../packages/accessflow-sdk.jar"
          if [ ! -f "$JAR_FILE" ]; then
            echo "❌ Error: JAR file not found at $JAR_FILE"
            ls -la ../packages/
            exit 1
          fi
          mvn install:install-file \
            -Dfile="$JAR_FILE" \
            -DgroupId=com.acsbe \
            -DartifactId=accessflow-sdk \
            -Dversion=1.0.1-dev-80604 \
            -Dpackaging=jar \
            -DgeneratePom=true
          echo "✅ SDK installed to local Maven repository"

      - name: Resolve Maven dependencies
        working-directory: ./sdk-tests/java
        run: mvn dependency:resolve

      - name: Install Playwright browsers
        working-directory: ./sdk-tests/java
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.classpathScope=test -D exec.args="install --with-deps chromium"

      - name: Create test-results directory
        run: mkdir -p test-results
        working-directory: ./sdk-tests/java

      - name: Run Playwright JUnit tests (SDKPlaywrightTest)
        working-directory: ./sdk-tests/java
        env:
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}
          CI: true
        run: mvn test -Dtest=SDKPlaywrightTest -DskipTestNG=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-playwright-junit-results
          path: |
            sdk-tests/java/test-results/
            sdk-tests/java/target/surefire-reports/
          retention-days: 7

  java-playwright-testng:
    if: env.SDK_PLAYWRIGHT_JOB == 'java-playwright-testng'
    name: Java Playwright (TestNG)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install SDK to local Maven repository
        working-directory: ./sdk-tests/java
        run: |
          echo "📦 Installing SDK JAR to local Maven repository..."
          JAR_FILE="../packages/accessflow-sdk.jar"
          if [ ! -f "$JAR_FILE" ]; then
            echo "❌ Error: JAR file not found at $JAR_FILE"
            ls -la ../packages/
            exit 1
          fi
          mvn install:install-file \
            -Dfile="$JAR_FILE" \
            -DgroupId=com.acsbe \
            -DartifactId=accessflow-sdk \
            -Dversion=1.0.1-dev-80604 \
            -Dpackaging=jar \
            -DgeneratePom=true
          echo "✅ SDK installed to local Maven repository"

      - name: Resolve Maven dependencies
        working-directory: ./sdk-tests/java
        run: mvn dependency:resolve

      - name: Install Playwright browsers
        working-directory: ./sdk-tests/java
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.classpathScope=test -D exec.args="install --with-deps chromium"

      - name: Create test-results directory
        run: mkdir -p test-results
        working-directory: ./sdk-tests/java

      - name: Run Playwright TestNG tests (SDKTestNGTest)
        working-directory: ./sdk-tests/java
        env:
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}
          CI: true
        run: mvn test -DskipJunit=true -DtestngSuiteFile=testng.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-playwright-testng-results
          path: |
            sdk-tests/java/test-results/
            sdk-tests/java/target/surefire-reports/
            sdk-tests/java/target/testng-reports/
          retention-days: 7
