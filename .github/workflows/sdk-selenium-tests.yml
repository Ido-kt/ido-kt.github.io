  # ============================================================================
  # Python Selenium (cycle 4/6)
  # ============================================================================
  python-local:
    name: Python Selenium
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        working-directory: ./sdk-tests/python
        run: pip install -r requirements.txt

      - name: Install SDK from local package
        working-directory: ./sdk-tests/python
        run: |
          echo "📦 Installing SDK from local package..."
          pip install ../packages/accessflow_sdk-*.whl

      - name: Install Chrome for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb

      - name: Run Selenium tests
        working-directory: ./sdk-tests/python
        env:
          ACCESSFLOW_SDK_API_KEY: ${{ secrets.ACCESSFLOW_SDK_API_KEY }}
          CI: true
        run: pytest -v -m selenium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-selenium-local-results
          path: sdk-tests/python/test-results/
          retention-days: 7

